<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101014" />
    <title>Boss Repellent</title>
  </head>
  <body>
    <div id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
    </div>

    <div id="ui">
      <div class="topbar">
        <button id="btn-faces" class="chip">Change faces</button>
        <button id="btn-debug" class="chip">Debug</button>
      </div>
      <div id="debug-panel" class="panel" hidden>
        <div id="debug-state" class="mono">state: —</div>
        <label class="slider">
          <span class="mono">threshold <b id="thr-value">0.40</b></span>
          <input id="thr" type="range" min="0.05" max="0.9" step="0.05" value="0.4" />
        </label>
      </div>
      <div class="hint">Point at a screen. Tap anywhere to test.</div>
    </div>

    <div id="gate" class="screen">
      <h1>Boss Repellent</h1>
      <p id="gate-text">Your colleagues will shoo you away from any screen you point at.</p>
      <button id="gate-btn" class="primary">Start camera</button>
    </div>

    <div id="loading" class="screen" hidden>
      <div class="spinner"></div>
      <p id="loading-text">Loading model…</p>
    </div>

    <div id="setup" class="screen setup" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
